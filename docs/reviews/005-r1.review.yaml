notes: |
  Doc is structurally serious and research-anchored, but multiple gates fail. Most consequential
  failures: (1) Pillar 2 scope substitution silently contradicts the brainstorm + philosophy doc
  it claims to derive from; (2) Gate 0 via skill markdown re-introduces the BUG-001 anti-pattern
  the LLD purports to obsolete; (3) success criteria mix philosophy declarations with measurable
  acceptance items, making sign-off ambiguous; (4) two arXiv IDs are unverifiable as cited.
  These are structural, not taste-level. Conditional pass is not appropriate — the Pillar 2
  scope shift and BUG-001 recurrence both need explicit user re-decision, not a follow-up
  cleanup. Strengths: gate redesign rationale is sound; attestation YAML schema is a meaningful
  artifact; supersession primitive is well-specified. Recommend revision (LLD-005-r2) addressing
  required_followup before bootstrap-review attestation is generated.
