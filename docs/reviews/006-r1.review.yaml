notes: |
  LLD-006 is markedly tighter than r1/r2: smaller scope, glossary present, dogfood
  migration explicit, philosophy roadmap-update kept out of scope cleanly. Several
  r2 review followups are addressed (e.g. clearer scope fence, glossary added, no
  Pillar reuse). However the same evidence-citation laxity, the same pytest baseline
  bare-assertion, and the same version-bump rationale recur. New consistency defects
  emerge from the dogfood case — the LLD's own r2 (this LLD's predecessor) has
  Supersedes: r1 yet is Rejected, and the LLD doesn't cover that lifecycle. Three
  different definitions of 'canon-frozen' across one doc is a Gate 4 critical-tier
  inconsistency. The is_narrow_change predicate is too vague to test against the
  L2 acceptance criterion. Followup is mostly cleanup-shaped but the dogfood
  lifecycle gap is rewrite-shaped for one section.
