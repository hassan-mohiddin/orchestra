    findings:
      - severity: High
        location: "Design § cli.spec_review main() doc-read sequence"
        problem: "F6 stale-state protection bypassable via TOCTOU: doc is read multiple times (read_bytes for hash, parse_iteration via separate read_text, render_prompt via another read_text, write-time re-hash). Concurrent edit between reads can swap content and restore original bytes before final hash check, passing stale-state check while subagent reviewed different bytes."
      - severity: High
        location: "Design § cli.spec_review main() compute_attestation_path call"
        problem: "Attestation write path not anchored to repo_root. compute_attestation_path returns relative docs/reviews/ path; caller writes directly. If invocation cwd ≠ repo_root, existence check + write target wrong directory tree."
      - severity: Medium
        location: "Acceptance A8 + Security § token-cap claim"
        problem: "Dispatch security controls (token cap, subagent_type) said 'enforced in code' but implementation has dispatch at agent layer only; cli.spec_review reads YAML from stdin without enforcing kwargs. Silent drift path between claimed and actual enforcement."
