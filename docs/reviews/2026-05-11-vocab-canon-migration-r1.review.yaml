  \ in slice 2 task 2.2 conflates two distinct constants; WHITELIST_FRONTMATTER_FIELDS\
  \ is line 87 alone and REFS_ELIGIBLE_PREFIXES ends at line 84. Also REQUIRED_SECTIONS\
  \ at 105-130 is not in slice 2 deletion list yet slice 3 expands it.\n\nImportant\
  \ issues center on LLD-Plan overlap (slice 3 enumerates conditional-section matrix\
  \ LLD owns) and underspecified design choices (1.7 _repo_root reuse mechanism, 7.2\
  \ consolidation direction, 12.4 status-flip ordering).\n\nEvidence verification:\
  \ cited line numbers largely accurate; minor precision gaps in 4.2 + 11.\n"
