      \ as 'planned repro, not currently runnable' or remove."
    raised_by:
    - semantic
    scope: instance
  - severity: Minor
    location: "Root Cause Analysis \xA7 Canon gap"
    problem: "Quoted canon text presented as \xA74.9 wording without line/anchor \u2014\
      \ citation is to the section but not pinpointed; reader must search canon file\
      \ to verify."
    raised_by:
    - semantic
    scope: instance
  - severity: Minor
    location: "Fix Description \xA7 item 5"
    problem: '''Estimated total: 3-4 hours'' is a planning estimate that belongs in
      a Plan doc or impl-session scoping, not in a Bug Report''s Fix Description per
      LLD-vs-Plan no-overlap discipline.'
    raised_by:
    - semantic
    scope: instance
  - severity: Minor
    location: "Regression Prevention \xA7 item 3"
    problem: "Lint-level guard ('could refuse...') is speculative rather than a regression-prevention\
      \ commitment \u2014 either commit to it or move to Future Work."
    raised_by:
    - semantic
    scope: instance
  justification: "Bug Report structurally complete; core claim (v1.0-only gates.<gate>.findings\
    \ lookup vs v2.0 schema with no gates key) is consistent and well-evidenced. But:\
    \ Expected Behavior depends on a deferred canon decision; Approach A vs B reads\
    \ as deliberation inside a bug doc; example commit msg cites 'finding 1 (Important)'\
    \ without verifying that finding exists at that index with that severity. None\
    \ invalidates core thesis \u2192 conditional_pass."
- id: adversarial
  model: claude-opus-4-7
  mandatory: true
  rubric_version: adversarial-v1
  status: completed
  verdict: fail
  findings:
  - severity: Critical
    location: "Fix Description \xA7 Scope item 1 (Canon extension first)"
    problem: "Doc defers canon \xA74.9 indexing-semantics decision to a later impl\
      \ session while leaving fix scope 'sized + deferred.' Until canon resolves Approach\
      \ A vs B, ALL tiered narrow-change against v2.0 attestations remains broken\
      \ from v2.0.0 forward. No interim mitigation specified \u2014 gap is unbounded\
      \ in time and BUG-012 \xA7Post-ship #5 plus every future canon-frozen edit citing\
      \ v2 is silently blocked."
    raised_by:
    - adversarial
    scope: instance
  - severity: Critical
    location: "Fix Description \xA7 Approach A vs Approach B"
    problem: "Approach A filters findings_aggregated[] by gate-derived-from-raised_by[]\
      \ but doc admits structure/gate-compliance/architectural-fit sub-judges don't\
      \ cleanly map to a single v1 gate. Edge-case handling hand-waved. A finding\
      \ raised_by multiple sub-judges (aggregator dedup merges raised_by per LLD-011)\
      \ collapses to AMBIGUOUS gate membership \u2014 no tie-break rule specified.\
      \ Correctness hole."
    raised_by:
    - adversarial
    scope: instance
  - severity: Critical
    location: "Steps to Reproduce \xA7 lines 32-39"
    problem: 'Repro recipe is unfalsifiable. Asserts ''fails with finding_n_out_of_range:
      gate evidence finding 1 (have 0)'' but does NOT show actual command output captured
      from the failing run. If ADDRESSES_LINE_RE rejects citation earlier (e.g., on
      .orchestra.review.yaml suffix), actual failure path differs (unrecognized_addresses_line,
      not finding_n_out_of_range). Unverified repro = unverified bug shape = wrong
      fix.'
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Expected Behavior \xA7 item 3"
    problem: "Indexing semantics forward-references canon \xA74.9 extension that does\
      \ NOT YET EXIST. Expected behavior cannot depend on undefined canon \u2014 inverts\
      \ doc lifecycle; reviewer cannot verify spec because spec is 'whatever canon\
      \ says later.'"
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Root Cause Analysis \xA7 Two coupled gaps item 2"
    problem: "Asserts LLD-011 shipped 'without the canon extension' but does not check\
      \ whether LLD-011 itself or its r1/r2 attestations recorded any indexing rule\
      \ for v2 attestations elsewhere. If LLD-011 specifies indexing by accident/intent,\
      \ this conflates 'canon \xA74.9 unaware' with 'no canon answer exists anywhere.'\
      \ Schema or LLD-011 may already imply Approach B by structure."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Environment \xA7 L162 cite + Iteration Log \xA7 r1"
    problem: Tag claim mismatch. Environment says 'orchestra v2.0.0 (tag at be7cdc0).'
      No git log evidence cited; if be7cdc0 is wrong, downstream readers chasing it
      hit dead reference.
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Fix Description \xA7 item 3 Regex update"
    problem: "Says regex 'already does match both filename forms' for .orchestra.review.yaml\
      \ but leaves 'Verify' as TODO inside fix description \u2014 reviewer takes on\
      \ faith. If regex actually fails on .orchestra.review.yaml, failure mode changes\
      \ (parse error, not lookup error) and item 4 test matrix misses it."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Regression Prevention \xA7 lint-level guard bullet"
    problem: "Proposed fail-closed guard does not address forward-compat: when v3.0\
      \ ships, the same guard rejects v3 attestations until lint is updated, recreating\
      \ this exact bug class. No 'unknown schema \u2192 soft-warn + degrade' path\
      \ proposed."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Fix Description \xA7 Estimated total"
    problem: "'3-4 hours' excludes canon \xA74.9 extension spec-review cycle. Per\
      \ Gate 3 canon edit requires spec review + iterations + commit. Realistic floor\
      \ with one iteration is ~5-7h. Undercount risks impl session running out of\
      \ context mid-fix."
    raised_by:
    - adversarial
    scope: instance
  - severity: Minor
    location: "Fix Description \xA7 item 2 code snippet"
    problem: "att.get('schema_version') == '2.0' compares against string literal.\
      \ v2.0 schema may emit numeric or '2.0.0' semver \u2014 no normalization. Fragile\
      \ to patch-level bump."
    raised_by:
    - adversarial
    scope: instance
  - severity: Minor
    location: "Steps to Reproduce \xA7 unit-level"
    problem: "'Test does not yet exist; planned' \u2014 for a High-severity bug blocking\
      \ canonical workflow, a RED unit test should accompany the BUG to make regression\
      \ mechanically reproducible. Without it, fix-completion has no objective signal."
    raised_by:
    - adversarial
    scope: instance
  - severity: Minor
    location: "Root Cause Analysis \xA7 Mermaid diagram"
    problem: "Diagram omits unknown_gate branch and regex-parse-failure branch. Reader\
      \ sees only 'gates absent \u2192 empty findings \u2192 out-of-range' path; doc's\
      \ own Fix Description item 3 acknowledges regex concern not in diagram."
    raised_by:
    - adversarial
    scope: instance
  justification: "Three Critical (deferred canon blocks all v2 narrow-change indefinitely;\
    \ Approach A multi-raised_by aggregation ambiguity; repro asserted not executed),\
    \ seven Important, three Minor. Verdict: fail \u2014 bug real and well-scoped\
    \ at symptom level, but proposed fix has correctness gaps (Approach A ambiguity),\
    \ forward-reference dependencies (canon not yet written), and unverified core\
    \ claims (repro not executed, tag not grounded, regex not checked)."
