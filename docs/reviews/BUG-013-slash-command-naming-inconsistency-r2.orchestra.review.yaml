- id: adversarial
  model: claude-opus-4-7
  mandatory: true
  rubric_version: adversarial-v1
  status: completed
  verdict: fail
  findings:
  - severity: Critical
    location: "Regression Prevention \xA7 mechanical layer"
    problem: Discipline-only prevention; no mechanical layer. The same drift will
      recur the moment a future skill author copies an old template. No lint/hook/CI
      enforces `name:` field consistency. BUG-013 will re-occur within 2-3 skill authoring
      cycles.
    raised_by:
    - adversarial
    scope: instance
  - severity: Critical
    location: "Root Cause Analysis \xA7 one-level-deep discovery"
    problem: '''One-level-deep discovery'' invariant treated as stable but is undocumented
      host-runtime detail. If Claude Code''s plugin loader gains recursive sub-skill
      discovery, every sub-skill with `name: init` immediately collides with parent''s
      slash. Time bomb keyed to external version bump.'
    raised_by:
    - adversarial
    scope: instance
  - severity: Critical
    location: "Fix Description \xA7 Phase 3 deferral"
    problem: 'Phase 3 deferred to v2.0.1 with no committed ship date or issue tracking.
      CLAUDE.md table marked ''closed by BUG-013'' while CHANGELOG entry deferred.
      Audit asymmetry: consumers reading CLAUDE.md see ''closed'' while public release
      notes never record the change if v2.0.1 slips.'
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Frontmatter \xA7 rubric note dismissal"
    problem: "r1 Critical 'Symptom/Test Plan/Risk missing' dismissed via 'canon \xA7\
      4.8 supersedes' without quoting \xA74.8 text. Sets precedent \u2014 any future\
      \ Critical can be deflected by 'canon supersedes'. Fail-open escape valve for\
      \ spec-review gate itself."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Observed Behavior \xA7 verification methodology"
    problem: "'Session-start available-skills list shows no orchestra:design-docs-init'\
      \ is one-shot observation not regression test. Next session \u2014 different\
      \ machine/version/state \u2014 observation may differ. No automated assertion\
      \ captures invariant."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Observed Behavior \xA7 decorative-documentation claim"
    problem: 'Sub-skill `name:` field claimed ''decorative documentation'' but `orchestra:design-docs:init`
      references appear in skill body prose. If sub-skill SKILL.md `name: init` no
      longer matches prose references, future readers hit contradiction. Decoration
      without consistency creates new defects.'
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Root Cause Analysis \xA7 bare-name collision"
    problem: 'Bare `name: init` in `skills/init/SKILL.md` assumed to auto-namespace
      as `/orchestra:init`. If Claude Code ever renders without plugin prefix (flat
      skill-picker UI, debug mode, future API), `name: init` collides with well-known
      `/init` (init CLAUDE.md). Host-runtime collision risk unanalyzed.'
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Iteration Log \xA7 r2 closure verification"
    problem: r2 claims 'Phase 1 + Phase 2 closed' but provides no diff or commit-link
      verification within doc body that 1bbc0d0 + 5e82443 actually changed `name:`
      field. Reviewer reading only Bug Report can't independently verify without git
      show. Bug Reports should be self-contained audit artifacts.
    raised_by:
    - adversarial
    scope: instance
  - severity: Minor
    location: "Fix Description \xA7 Phase 3 rollback"
    problem: '''Deferred to v2.0.1 ship'' has no rollback plan if v2.0.1 cancelled
      or merged into v2.1. CHANGELOG entry then has no home.'
    raised_by:
    - adversarial
    scope: instance
  - severity: Minor
    location: "Observed Behavior \xA7 verification methodology"
    problem: "Verification relies on session-start system-reminder block \u2014 itself\
      \ a host-runtime implementation detail. If Claude Code changes skill-list surface\
      \ (truncation, lazy-load, grouped display), methodology becomes invalid silently."
    raised_by:
    - adversarial
    scope: instance
  - severity: Minor
    location: "Root Cause Analysis \xA7 consumer-plugin collision"
    problem: "No analysis of consumer repo with own skill named `init` at top-level.\
      \ Two `name: init` from different plugins \u2192 undefined resolution order.\
      \ Doc treats orchestra as only plugin in namespace."
    raised_by:
    - adversarial
    scope: instance
