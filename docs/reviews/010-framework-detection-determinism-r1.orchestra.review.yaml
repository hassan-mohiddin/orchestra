notes: 'LLD-010 architectural shape sound (separate snippet file, framework-detection
  with tailoring, --apply opt-in, --verify entrypoint, hard-fail). HOWEVER load-bearing
  technical claim driving entire LLD - that pass_filenames: false on commit-msg hook
  causes framework to withhold msg-file path - is INVERTED relative to authoritative
  pre-commit.com docs. commit-msg hooks ALWAYS receive msg-file regardless of pass_filenames.
  Invalidates Problem Statement defect 2, Glossary entry, A1 central rationale, snippet
  IMPORTANT comment, codex r2 high 1 attribution. Several secondary defects: pseudocode
  fsync bug, atomic-write re-opens tmp discarding write buffer, A3 ''shorter snippet''
  implementation undefined (only ... stub), A8 reconciliation does not address LLD-008
  A3 inventory asymmetry split rationale absent, edge case for two repo: local blocks
  may break duplicate-id detection (A3 only scans for both ids subset; partial-config
  edge 2 contradicts itself on whether --apply errors or just emits manual-merge guidance).
  Recommend pause before iteration 2: verify pass_filenames behavior with actual pre-commit
  repro (5 min) before redrafting.'
