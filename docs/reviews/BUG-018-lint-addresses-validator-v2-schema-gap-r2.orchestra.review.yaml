- id: adversarial
  model: claude-opus-4-7
  mandatory: true
  rubric_version: adversarial-v1
  status: completed
  verdict: conditional_pass
  findings:
  - severity: Important
    location: "Fix Description \xA7 Implementation scope item 2 (v2.0 branch)"
    problem: "Spec writes `att.get('sub_judges', {}).get(gate, {}).get('findings',\
      \ [])` then parenthetical 'sub_judges may be a list' \u2014 two mutually-exclusive\
      \ access patterns. Reviewer of fix-impl PR cannot determine canonical form.\
      \ Pick one, delete the other, or specify 'schema declares sub_judges as <X>;\
      \ code uses <Y>'."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Fix Description \xA7 Approach decision rationale bullet 1"
    problem: "Rationale 'multi-raised_by ... no tie-break rule possible without arbitrary\
      \ precedence' conflates (a) Approach A indexing by v1 gate name with (b) multi-raised_by\
      \ being a property of the underlying finding. A deterministic Approach A is\
      \ constructable with explicit precedence order. Doc presents multi-raised_by\
      \ as inherently killing A when in fact it kills only na\xEFve A. Tighten rationale\
      \ or acknowledge precedence-rule A exists and was rejected for other reasons."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Fix Description \xA7 Interim mitigation Option 2 selection for BUG-012\
      \ \xA7Post-ship #5"
    problem: Selecting Option 2 (--no-verify bypass) as intended path is stated without
      showing Option 1 (supersession) was evaluated and rejected on merits. LLD-009
      r6 default for canon-frozen edits IS supersession; --no-verify is explicit backstop,
      not preferred path. Justify the inversion or switch default to Option 1.
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Regression Prevention \xA7 Lint-level guard (deferred to impl session)"
    problem: 'Bullet ''cli.lint could refuse Addresses: lines that lack a recognized
      schema_version'' duplicates the unknown_schema_version path already speced in
      Fix Description item 2. Delete bullet or scope distinctly (e.g., refuse attestations
      with NO schema_version field at all).'
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Fix Description \xA7 Implementation scope item 1 (Canon extension)"
    problem: "'Reconcile \xA74.11 in the same change (single canon edit; one spec-review\
      \ pass).' \xA74.11 may itself need fact-checking against actual on-disk filenames\
      \ before reconciliation is well-defined. Either pre-verify \xA74.11's current\
      \ state, or expand the canon-edit scope estimate accordingly."
    raised_by:
    - adversarial
    scope: instance
  - severity: Minor
    location: "Root Cause Analysis \xA7 mermaid diagram"
    problem: "Diagram shows pre-fix `gates absent \u2192 empty findings \u2192 out-of-range`\
      \ only; doesn't show post-fix sub_judges[<gate>].findings[] path Approach B\
      \ introduces. Add a second flowchart or branch for at-a-glance pre/post comparison."
    raised_by:
    - adversarial
    scope: instance
  - severity: Minor
    location: "Steps to Reproduce \xA7 Regression test (planned for fix-impl session)"
    problem: Test block provides one-line comment summary. A RED test in pseudocode
      (imports + first assertion stub, ~5 lines) would let fix-impl session start
      with copy-paste-ready failing test rather than re-deriving from prose.
    raised_by:
    - adversarial
    scope: instance
  - severity: Minor
    location: "Iteration Log \xA7 r2 entry"
    problem: 'Log conflates semantic-sub-judge closure into adversarial-iteration-log
      entry without prefixing ''semantic Important #1 also closed by ...'' for cross-sub-judge
      audit clarity.'
    raised_by:
    - adversarial
    scope: instance
  justification: "Iter-2 closes the 3 iter-1 Criticals substantively (Approach B selection\
