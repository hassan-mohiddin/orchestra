  evidence:
    verdict: fail
    findings:
    - severity: Critical
      location: "Glossary \xA7 pass_filenames"
      problem: 'Glossary states pass_filenames true => framework passes msg-file;
        false => no positional arg. WRONG per pre-commit.com docs: ''commit-msg hooks
        will be passed a single filename ... regardless of pass_filenames setting''.
        msg-file is passed regardless of pass_filenames. pass_filenames controls OTHER
