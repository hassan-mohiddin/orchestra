  - "Resolve the BUG-001 anti-pattern recurrence: Gate 0 via skill markdown is the same failure mode BUG-001 identified — either justify in-doc or move to CLI/hook mechanism."
  - "Acknowledge BUG-008 supersession: LLD-005 changes the BUG-008 Phase 1 enforcement mechanism (in-doc marker → external attestation); add explicit cross-reference and update BUG-008 status."
