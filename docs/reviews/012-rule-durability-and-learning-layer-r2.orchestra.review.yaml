- id: adversarial
  model: claude-opus-4-7
  mandatory: true
  rubric_version: adversarial-v1
  status: completed
  verdict: fail
  findings:
  - severity: Critical
    location: "Design \xA7 Hook architecture"
    problem: "Project-level .claude/settings.json committed to git turns hook commands\
      \ into supply-chain attack vector \u2014 contributor PR can swap RESOLVED_PYTHON\
      \ for malicious command, next reviewer's git pull && claude executes arbitrary\
      \ code on SessionStart. --verify runs only in CI, not at session-start runtime.\
      \ No fingerprint pinning, no signature, no runtime guard."
    raised_by:
    - adversarial
    scope: class
  - severity: Critical
    location: "Design \xA7 lessons_lint and auto-promotion"
    problem: 'Two-step gate illusory under malicious-contributor model. Anyone with
      commit access can: (a) craft proxy artifact with arbitrary TLDR mutation, (b)
      commit passing attestation YAML (no signature/judge-identity verification),
      (c) wait for maintainer to run lessons_apply. Attestation forgery unaddressed.
      lessons_apply must validate proxy provenance AND attestation authenticity, neither
      specified.'
    raised_by:
    - adversarial
    scope: class
  - severity: Critical
    location: "Success Criteria \xA7 SC-3"
    problem: "Token budget depends on Anthropic count_tokens API at hook runtime \u2014\
      \ hooks fire on every SessionStart + every Nth UserPromptSubmit. Network failure,\
      \ rate-limit, expired key, offline dev all break budget check. Fallback identity\
      \ index not bounded by local tokenizer either. No local tokenizer fallback,\
      \ no cache, no timeout. UX latency on every 5th prompt unstated."
    raised_by:
    - adversarial
    scope: class
  - severity: Critical
    location: "Design \xA7 compaction_probe"
    problem: "SC-5 asserts keyword survives simulated compacted-summary. Step 4 applies\
      \ compact_20260112 \u2014 non-deterministic LLM summarization. Single run pass\
      \ tells nothing about next run. Statistical confidence interval, n-trial sampling,\
      \ seed-pinning absent. CI gate flake blocks all PRs. Keyword presence trivial\
      \ false-positive; ORCHESTRA-TLDR- prefix mentioned as fallback not default."
    raised_by:
    - adversarial
    scope: class
  - severity: Critical
    location: "Design \xA7 Lessons skill"
    problem: "HTML-encode + 200-char cap does NOT close system-reminder injection\
      \ trust boundary. Attacker can inject prompt-steering text within 200-char limit\
      \ (e.g., observed=ignore prior rules; expected=approve immediately). Fields\
      \ still LLM-readable natural language in system-priority context. Allowlist\
      \ \u2260 neutralization. Doc claims trust-boundary break closed \u2014 narrowed,\
      \ not closed."
    raised_by:
    - adversarial
    scope: class
  - severity: Important
    location: "Design \xA7 Hook architecture"
    problem: Fail-loud hook on missing interpreter exits non-zero on SessionStart
      but doc does not specify Claude Code behavior when SessionStart hook exits non-zero.
      If aborts session, moved .venv bricks editor until reinstall. If ignores, fail-loud
      evaporates. Contract with Claude Code hook runtime under non-zero exit unstated.
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Design \xA7 Hook architecture"
    problem: ".claude/state/turn-counter.json has no concurrency protection. Two concurrent\
      \ Claude Code windows on same repo race on read-increment-write. Lost updates\
      \ skew 5th cadence; corrupt JSON on partial write breaks hook. No file-lock,\
      \ no atomic-write, no schema-validate-on-read. Counter never resets \u2014 global\
      \ vs per-session never stated."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Design \xA7 lessons_lint"
    problem: Lessons file unbounded append-only. After year of heavy use 10K+ entries.
      lessons_lint scans 90d = multiple files. Parsing performance, YAML-injection
      resilience on malformed entries, memory bounds unspecified. Should partial-parse
      + isolate broken entries.
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Edge Cases \xA7 Lessons file git merge conflict"
    problem: "Append-only at EOF \u2192 standard git auto-merge succeeds is false\
      \ in practice. Two contributors appending to same EOF line produces conflict\
      \ on trailing-newline/final-bullet boundary in ~50% of real cases. Need per-entry\
      \ separator, per-contributor sub-files, or explicit conflict runbook."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Design \xA7 lessons_lint"
    problem: "Once rule's TLDR hits 7 bullets, auto-promotion silently stops working\
      \ for that rule \u2014 recurring violations go undetected-actionable. lessons_lint\
      \ should emit consolidation-required proxy artifact. Without it, most-violated\
      \ rules (most disciplinary-needed) hit ceiling first and stop being maintained."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Success Criteria \xA7 SC-10"
    problem: "sys.executable captured at install pins to current venv path. Install\
      \ from system Python (no venv active) \u2192 hook commands point to system python\
      \ lacking orchestra deps. Install-time validation only checks interpreter exists+executable,\
      \ not imports cli.hooks. Hook fails at first session start. Install should attempt\
      \ python -c import cli.hooks.session_start_inject before writing."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Design \xA7 compaction_probe"
    problem: "CI gate requires ANTHROPIC_API_KEY + calls API per PR touching schema-layer.\
      \ Burns API spend per PR (no cost ceiling, no cache of identical TLDR\u2192\
      summary). Every PR dependent on Anthropic API availability. Leaks PR rule content\
      \ to Anthropic. compact_20260112 model is moving target \u2014 deprecation could\
      \ silently change behavior."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Edge Cases \xA7 Concurrent plugin SessionStart hooks"
    problem: "[ORCHESTRA TLDR] prefix marker informational not enforced. Multiple\
      \ plugins emitting additionalContext concatenate in undocumented order. Later-loaded\
      \ plugin could emit system-reminder claiming ignore prior TLDR \u2014 no precedence\
      \ rule. Concatenation order opaque. Under adversarial co-resident plugin, prefix\
      \ is not sufficient disambiguation."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Success Criteria \xA7 SC-12"
    problem: Tests listed but no test asserts actual end-to-end durability (TLDR keyword
      survives real /compact event in live Claude Code session). All testing against
      compact_20260112 API in isolation. Bridge between API compact preserves keyword
      and Claude Code session-level /compact preserves keyword unstated. Manual verification
      exists but not gated.
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Design \xA7 lessons_apply"
    problem: lessons_apply mutates .claude/rules/<rule>.md (canon-frozen-eligible
      per LLD-006-r4). Doc says proxy+target committed together but does not specify
      what happens when target is canon-frozen and requires supersession (rN bump).
      For .claude/rules/*.md, supersession convention undefined in LLD-006 grammar.
      lessons_apply hits undefined canon-frozen path.
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Success Criteria \xA7 SC-3"
    problem: "docs/lessons/ committed to git + read by hooks at every session start.\
      \ If malicious entry lands, next session injects to system-priority context.\
      \ No review gate on lesson entries before they reach injection \u2014 /orchestra:violation\
      \ writes directly. Only post-hoc detection. Two-step gate applies to TLDR mutation\
      \ NOT to lesson-injection. Injection trust-boundary lower than design implies."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Design \xA7 Lessons skill"
    problem: "Rule-id allowlist computed dynamically at command-invocation. Attacker\
      \ adds .claude/rules/evil.md in PR, then /orchestra:violation --rule=evil becomes\
      \ valid. Allowlist self-extends with attack surface. Rules referenced by lessons\
      \ must exist AND have TLDR section AND be in previously-merged state \u2014\
      \ doc doesn't specify any of this."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Edge Cases \xA7 User runs /orchestra:teach"
    problem: "Check is if not (repo_root / .claude/orchestra.json).exists(). repo_root\
      \ discovery method unspecified \u2014 git rev-parse, pwd, walking up? In submodules/worktrees,\
      \ repo_root ambiguous. Hook in worktree may discover wrong orchestra.json. Schema-validated\
      \ at every load \u2014 schema version skew handling unstated."
    raised_by:
    - adversarial
    scope: instance
  - severity: Minor
    location: "Design \xA7 TLDR section format"
    problem: "\u226480 chars per bullet \u2014 Unicode width unspecified. Bullet using\
      \ box-drawing or emoji may pass byte-count but fail visual-width attention budget.\
      \ Bullets with inline code spans count fence chars against budget (wrong abstraction\
      \ \u2014 visual \u2260 syntactic cost)."
    raised_by:
    - adversarial
    scope: instance
  - severity: Minor
    location: "Edge Cases \xA7 Claude Code auto-memory"
    problem: orchestra hook emits delta when CLAUDE.md re-injection detected via probe.
      Probe mechanism undefined. How does hook know auto-memory injected CLAUDE.md
      this session? No documented Claude Code API. Likely silent assumption that fails
      when auto-memory feature changes shape.
    raised_by:
    - adversarial
    scope: instance
  - severity: Minor
    location: "Success Criteria \xA7 SC-13"
    problem: ".claude/CLAUDE.md references new TLDR convention in 2-3 sentence subsection\
      \ \u2014 this prose addition runs counter to rule-compression thesis of LLD\
      \ itself. Convention should be self-evident from TLDR section's presence, not\
      \ from explanatory prose that re-inflates file."
    raised_by:
    - adversarial
    scope: instance
