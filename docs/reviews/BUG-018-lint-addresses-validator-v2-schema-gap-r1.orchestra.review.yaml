    raised_by:
    - semantic
    scope: instance
  - severity: Important
    location: "Fix Description \xA7 Approach A vs B"
    problem: "Two approaches with pros/cons but doc both says 'Decision is deferred'\
      \ and 'likely Approach A' \u2014 ambiguous whether bug records a chosen direction\
      \ or RFC; per project rules bug docs should not deliberate. Choose or punt explicitly\
      \ to follow-up ADR."
    raised_by:
    - semantic
    scope: instance
  - severity: Important
    location: "Steps to Reproduce \xA7 unit-level block"
    problem: "'Test does not yet exist; planned' leaves repro incomplete \u2014 no\
