notes: |
  r2 makes real progress on r1 evidence findings (citations bound; pytest baseline
  captured; rejected-supersession rule defined). Evidence gate now PASSES — first
  gate-pass across all reviews. However a NEW Critical defect emerges: doc-id-burn
  as specified rejects supersession revisions sharing the same doc-id, precisely
  the dogfood case (006-r2 supersedes 006-r1 sharing id=6). This is not r1 regression;
  it is a new flaw introduced by adding doc-id-burn machinery without harmonising
  it with the -rN suffix convention. Two r1 followups are textually re-stated
  rather than resolved: supersession-path 'OR' still appears, is_narrow_change
  testability moved one layer deeper (spec to helper-implementation). L3 added as
  acceptance gate but lacks test. Net: r2 closer to mergeable than r1 but not
  shippable; doc-id-burn vs supersession conflict is rewrite-shaped for §Doc-id-burn.
