      \ to recorded canon is missing where direct conflict exists."
    scope: instance
    raised_by:
    - architectural-fit
  - severity: Important
    location: "Scope \xA7 Out of Scope row 1 + Design \xA7 PDSA item 4"
    problem: "LLD-011 repeatedly defers vocabulary-canon work to BUG-016 closure /\
      \ controlled-vocabulary canon ships, but docs/design/controlled-vocabulary.md\
      \ is already Status: Current \u2014 the canon is shipped. BUG-016 (Status: Investigating)\
      \ is the migration/lint-strict-match work, not the canon itself. Deferral framing\
      \ contradicts the recorded state of the Design Doc canon."
    scope: instance
    raised_by:
    - architectural-fit
  - severity: Important
    location: "Scope \xA7 item 2 + Design \xA7 Schema v2.0 + Design \xA7 Sub-judge\
      \ cast"
    problem: "Schema v2.0 declares no fixed gate names and defines six sub-judge ids\
      \ inline. docs/design/controlled-vocabulary.md \xA74.9 review_gate_names is\
      \ the canonical single-source-of-truth and requires that any gate-name extension\
      \ grows under the same canon \u2014 no parallel definition. LLD-011's inline\
      \ schema enum is a parallel definition; no deviation entry exists in the canon\
      \ Design Doc."
    scope: class
    raised_by:
    - architectural-fit
