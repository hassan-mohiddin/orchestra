    - severity: Critical
      location: "Problem Statement \xA7 defect 2 + A1 + line 30 + line 113-115"
      problem: Defect 2 (Snippet pass_filenames wrong for commit-msg stage. Naive
        snippet sets pass_filenames false ... framework does NOT pass msg-file path)
