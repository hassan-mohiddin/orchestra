- id: adversarial
  model: claude-opus-4-7
  mandatory: true
  rubric_version: adversarial-v1
  status: completed
  verdict: fail
  findings:
  - severity: Critical
    location: "Slice 3.2 \xA7 Token budget enforcement"
    problem: "SessionStart hook calls Anthropic count_tokens API synchronously on\
      \ every session start \u2014 network latency/timeout blocks Claude Code startup.\
      \ Fallback covers missing key but not slow/hanging API (no timeout specified).\
      \ 30s API hang = 30s startup delay per session. Blast radius every user session\
      \ every machine."
    raised_by:
    - adversarial
    scope: class
  - severity: Critical
    location: "Slice 3.5 \xA7 turn-counter atomic write"
    problem: "Q6 default os.replace atomic-write does NOT handle concurrent Claude\
      \ Code sessions in same repo. Read-modify-write race: A reads counter=4, B reads\
      \ counter=4, both write counter=5 \u2014 Nth-turn fires once instead of twice\
      \ OR fires twice. State file shared across sessions has no file-lock; atomic-write\
      \ only protects against torn writes not lost updates."
    raised_by:
    - adversarial
    scope: class
  - severity: Critical
    location: "Slice 4.1 \xA7 sys.executable interpreter resolution"
    problem: "sys.executable captured statically into settings.json. User reinstalls\
      \ venv \u2192 captured path stale, hooks fail silently or fail-loud per slice\
      \ 3.6 \u2014 Claude Code startup proceeds without TLDR injection (no upstream\
      \ signal hooks broken). Slice 4.3 --verify is opt-in CI gate not auto-detected\
      \ on session start. Failure: rm -rf .venv && uv venv \u2192 next session boot\
      \ hooks broken no TLDR no warning."
    raised_by:
    - adversarial
    scope: class
  - severity: Critical
    location: "Slice 6.4 \xA7 lessons_apply mutates schema-layer target"
    problem: "Schema-layer files are user-edited canonical rule files. lessons_apply\
      \ mutates them programmatically after attestation \u2014 no concurrency guard\
      \ against user-in-editor state. If user has CLAUDE.md open with unsaved changes\
      \ when lessons_apply runs, mutation either gets overwritten by editor save OR\
      \ overwrites user's in-flight edits. No file-modification-time check, no advisory\
      \ lock, no git status clean precondition."
    raised_by:
    - adversarial
    scope: class
  - severity: Critical
    location: "Slice 5.3 \xA7 rule-id allowlist"
    problem: "Allowlist derived from basenames of .claude/rules/*.md + CLAUDE.md +\
      \ workflow.md at runtime. Path-traversal test exists but allowlist itself trusts\
      \ filesystem state \u2014 symlink attack .claude/rules/evil.md \u2192 /etc/passwd\
      \ or attacker-added file in .claude/rules/ becomes valid rule-id. Injection\
      \ path then writes attacker-controlled content into lessons file feeding into\
      \ SessionStart system-reminder blocks \u2014 prompt-injection vector."
    raised_by:
    - adversarial
    scope: class
  - severity: Critical
    location: "Slice 3.3 \xA7 structured-violations injection allowlist"
    problem: "Allowlisted fields HTML-encoded + 200-char-capped but rule_violated\
      \ string goes verbatim into system-reminder template. If violation entry hand-edited\
      \ (or written by bug) with rule_violated='</system-reminder>\\n[NEW INSTRUCTION]...',\
      \ HTML-encode of observed/expected won't help \u2014 rule_violated escapes the\
      \ reminder block. Allowlist enforces field names not field-content sanitization."
    raised_by:
    - adversarial
    scope: class
  - severity: Important
    location: "Slice 1.6 \xA7 lessons store append"
    problem: "Append-only YAML at docs/lessons/<YYYY-MM>-lessons.md \u2014 no schema\
      \ migration story. If LLD-013 changes entry shape (adds required field), existing\
      \ v2.1 entries become unparseable or silently lossy. read_entries has no version\
      \ field on entries, no forward-compat strategy."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Slice 6.1 \xA7 lessons_lint recurrence detection"
    problem: "Recurrence threshold grouped by rule_violated over since_days=90. Adversarial:\
      \ (a) rule rename mid-window \u2014 same conceptual violation under old+new\
      \ rule_violated strings counts as 2 separate groups never hits 3; (b) typo in\
      \ rule_violated string creates separate groups; (c) bulk-import of historical\
      \ lessons spikes count artificially. No normalization, no fuzzy grouping, no\
      \ rate-limiting against burst."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Slice 3.2 \xA7 fallback to identity-rule-name index"
    problem: "Fallback identity-only index is silent degradation \u2014 Claude session\
      \ starts with NO TLDR content just rule names. From model's perspective indistinguishable\
      \ from no TLDR exists \u2014 defeats SC-1/SC-3 nonnegotiables-injection goal.\
      \ Repeated overbudget = silent permanent regression. No alert path (only log\
      \ to .claude/state/budget-overflow.log which nobody reads)."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Slice 6.2 \xA7 proxy artifact path collision"
    problem: "Proxy path docs/proposed-rule-mutations/<rule>-<date>.md \u2014 multiple\
      \ recurrences same rule same day collide. Second lint run overwrites first proxy\
      \ without warning. lessons_apply iteration lookup reads Iteration: N from proxy,\
      \ but if proxy overwritten between user spec-review and apply, attestation file\
      \ may reference stale Iteration N while proxy says N+1. Slice 6.3 attestation\
      \ lookup mismatches \u2192 refuse but root cause (path collision) unstated."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Slice 9.1 \xA7 self-install"
    problem: "Self-installing hooks on this repo means orchestra developers have dev\
      \ sessions instrumented with code they're developing. Bug in slice 3.x hook\
      \ handler \u2192 every subsequent dev session in this repo broken, including\
      \ session where you'd fix the bug. No 'disable orchestra hooks for orchestra-dev'\
      \ escape hatch. Bootstrap-paradox."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Slice 6.6 \xA7 compaction_probe"
    problem: "compact_20260112 is dated identifier \u2014 Anthropic may version-roll\
      \ (compact_20260712). Probe hardcodes the dated string; on Anthropic side-rolling\
      \ probe silently passes against OLD compact behavior while real /compact uses\
      \ NEW. Drift undetectable. No version-pinning policy or compat-test."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Slice 3.5 \xA7 ORCHESTRA_REINJECT_EVERY env var"
    problem: "User-tunable N via env var default 5 \u2014 no validation. N=0 \u2192\
      \ modulo-zero exception hook crashes every prompt \u2192 no Claude prompts succeed.\
      \ N=-1 / N=abc / N=99999 all unspecified. Single env-var misconfiguration bricks\
      \ Claude Code in repo."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Slice 4.4 \xA7 merge with existing settings"
    problem: Identification of orchestra entries by cli.hooks.* command prefix is
      fragile. If another plugin invokes python -m cli.hooks.foo (different cli package
      on PYTHONPATH), --uninstall removes it. No namespace marker (comment-key or
      dedicated orchestra-managed wrapper). Cross-plugin collision risk grows with
      ecosystem.
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Slice 7.2 \xA7 force-mode read-existing fail-closed"
    problem: "Malformed YAML detection: if YAML parse fails abort overwrite. What\
      \ defines malformed? Empty file (0 bytes) \u2014 does yaml.safe_load return\
      \ None (clean) or raise? Truncated file mid-document \u2014 parse succeeds yielding\
      \ partial data. Tabs vs spaces edge case. Underspecified contract."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Header \xA7 Architecture bullet 3"
    problem: "Portable interpreter resolution via sys.executable at install \u2014\
      \ install may be invoked through pipx run, uv tool run, ephemeral container\
      \ where sys.executable is a wrapper. Wrapper may not be long-lived path. No\
      \ validation resolved interpreter is one user expects. --verify catches stale\
      \ post-hoc; doesn't catch wrong-path at install."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Phase 2 \xA7 TLDR authoring"
    problem: "TLDR \u22647 bullets / \u226480 chars hard upper bound. Phase 6 compaction_probe\
      \ is only behavioral check that compaction preserves keywords. TLDR authoring\
      \ one-shot in Phase 2 \u2014 if probe fails Phase 9.2 with \u22652 file failures,\
      \ plan says STOP interview possible LLD-r3. Phase 2 work potentially throwaway.\
      \ No iterative authoring \u2192 probe-test loop within Phase 2. Risk register\
      \ acknowledges but Phase 9 is where it surfaces \u2014 late."
    raised_by:
    - adversarial
    scope: instance
  - severity: Important
    location: "Slice 9.6 \xA7 tag ordering"
    problem: "Tag points to slice 9.5 commit (Status flip). If HANDOFF spec-review\
      \ fails (conditional_pass or fail), 9.5 may need revision before tagging \u2014\
      \ but plan asserts slice 9.5 commit will be single small whitelist edit low\
      \ risk. No contingency for HANDOFF spec-review failing \u2192 tag chain blocked\
      \ indefinitely with no rollback procedure."
    raised_by:
    - adversarial
    scope: instance
  - severity: Minor
    location: "Slice 6.5 \xA7 keyword extraction"
    problem: "First 4+ char noun per bullet \u2014 noun detection by what mechanism?\
      \ No NLP dep declared; regex-based-on-capitalization fails on lower-case TLDR\
      \ bullets. POS-tagger is new heavy dep not in slice 1.0. Underspecified."
    raised_by:
    - adversarial
    scope: instance
  - severity: Minor
    location: "Slice 1.4 \xA7 overflow rejects with diagnostic"
    problem: "Reject if bullets >7 OR any bullet >80 chars \u2014 char-count includes\
      \ or excludes leading - markdown bullet marker? Empty/whitespace lines counted\
      \ as bullets? Off-by-one drift between authoring tool view and extractor view."
    raised_by:
    - adversarial
    scope: instance
  - severity: Minor
    location: "Slice 1.2 \xA7 missing close marker"
    problem: 'Take content to EOF on missing close marker is fail-open: rule file
      missing marker silently picks up ALL subsequent content as TLDR (potentially
      100s of lines). Logs WARN but proceeds. Behavior should arguably be fail-loud
      (reject) given TLDR is security-adjacent surface (gets system-reminder privilege).'
    raised_by:
    - adversarial
    scope: instance
